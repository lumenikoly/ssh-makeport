name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '12.0'

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Resolve dependencies
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
      - name: Core and offline integration tests
        run: cargo test --no-default-features --locked
      - name: Real shell and PTY tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check all targets
        run: cargo clippy --all-targets --locked
      - name: Build desktop application
        run: cargo build --release --locked
      - name: Package
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: MakePort-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error
