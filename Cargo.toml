[package]
name = "makeport"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A simple desktop app for forwarding many ports over SSH"
publish = false
build = "build.rs"

[[bin]]
name = "makeport"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build", "dep:winresource", "dep:zbus"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=0.8.23"
directories = "=6.0.0"
tempfile = "=3.23.0"
fs2 = "=0.4.3"
slint = { version = "=1.17.1", optional = true, default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "system-tray", "unstable-winit-030"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", optional = true }

[build-dependencies]
slint-build = { version = "=1.17.1", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.31", optional = true, default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
